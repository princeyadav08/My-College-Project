<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 380px;
    }

    h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; font-size: 1.3rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus { outline: none; border-color: #38bdf8; }

    .btn-login {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.85), rgba(0, 199, 255, 0.7));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 980px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
    }

    .btn-back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.3);
      color: #ff453a;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Admin Portal Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Admin username" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>

      <button class="btn-login" type="submit">Sign In</button>
      <a href="/" class="btn-back">&larr; Back to Portal</a>
    </form>
  </div>

</body>
</html>
