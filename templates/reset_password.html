<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 400px;
    }

    h2 { color: #38bdf8; margin-bottom: 8px; text-align: center; font-size: 1.3rem; }
    p.subtext { font-size: 0.82rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }

    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus { outline: none; border-color: #38bdf8; }

    .btn-reset {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.85), rgba(10, 132, 255, 0.85));
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 980px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .btn-reset:hover { opacity: 0.9; }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 0.85rem;
    }

    .links a { color: #94a3b8; text-decoration: none; }
    .links a:hover { color: #38bdf8; }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }

    .alert-danger {
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.3);
      color: #ff453a;
    }

    .alert-success {
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid rgba(48, 209, 88, 0.3);
      color: #30d158;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Reset Admin Password</h2>
    <p class="subtext">Enter your admin username & master security key.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/reset-password" method="POST">
      <label>Admin Username</label>
      <input type="text" name="username" placeholder="Sunny" required>

      <label>Master Security Key</label>
      <input type="password" name="security_key" placeholder="Enter security recovery key" required>

      <label>New Password</label>
      <input type="password" name="new_password" placeholder="••••••••" required>

      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" placeholder="••••••••" required>

      <button class="btn-reset" type="submit">Update Password</button>

      <div class="links">
         <a href="{{ url_for('login') }}">&larr; Back to Login</a>
        <a href="{{ url_for('index') }}">User Portal</a>
      </div>
    </form>
  </div>

</body>
</html>
