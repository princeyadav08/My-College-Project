<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h2 { color: #38bdf8; text-align: center; margin-bottom: 8px; }
    p.subtext { color: #94a3b8; font-size: 0.82rem; text-align: center; margin-bottom: 20px; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
    }
    .input-wrapper { position: relative; margin-bottom: 14px; }
    .input-wrapper input { margin-bottom: 0; padding-right: 40px; }
    .toggle-pwd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; }

    /* Strength Bar */
    .strength-meter { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 6px 0 14px; overflow: hidden; }
    .strength-bar { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; }

    .otp-box { display: flex; gap: 8px; margin-bottom: 14px; }
    .otp-box input { margin-bottom: 0; }
    .btn-otp { padding: 0 14px; white-space: nowrap; border-radius: 10px; background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; cursor: pointer; }
    .btn-otp:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-reset { width: 100%; padding: 12px; border-radius: 980px; border: none; background: linear-gradient(135deg, #38bdf8, #0a84ff); color: #0f172a; font-weight: 600; cursor: pointer; }
    .links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 0.85rem; }
    .links a { color: #94a3b8; text-decoration: none; }
    .links a:hover { color: #38bdf8; }
    .alert { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; }
    .alert-success { background: rgba(48, 209, 88, 0.2); color: #30d158; }
    .alert-danger { background: rgba(255, 69, 58, 0.2); color: #ff453a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtext">Enter your registered Email or Phone number</p>

    <div id="js-alert" class="alert" style="display:none;"></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/reset-password" method="POST">
      <label>Email Address or Phone</label>
      <input type="text" id="identifier" name="identifier" placeholder="admin@example.com / 9999999999" required>

      <label>One-Time Password (OTP)</label>
      <div class="otp-box">
        <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" required>
        <button type="button" id="sendOtpBtn" class="btn-otp" onclick="requestOTP()">Send OTP</button>
      </div>

      <label>New Password</label>
      <div class="input-wrapper">
        <input type="password" id="new_pwd" name="new_password" placeholder="New Password" oninput="checkStrength(this.value)" required>
        <button type="button" class="toggle-pwd" onclick="toggleVisibility('new_pwd')">👁️</button>
      </div>
      <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>

      <label>Confirm Password</label>
      <div class="input-wrapper">
        <input type="password" id="conf_pwd" name="confirm_password" placeholder="Confirm Password" required>
        <button type="button" class="toggle-pwd" onclick="toggleVisibility('conf_pwd')">👁️</button>
      </div>

      <button type="submit" class="btn-reset">Update Password</button>

      <div class="links">
        <a href="/login">&larr; Back to Login</a>
        <a href="/">User Portal</a>
      </div>
    </form>
  </div>

  <script>
    function toggleVisibility(id) {
      const field = document.getElementById(id);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function checkStrength(pwd) {
      const bar = document.getElementById('strengthBar');
      let score = 0;
      if (pwd.length >= 6) score += 30;
      if (/[A-Z]/.test(pwd)) score += 35;
      if (/[0-9!@#$%^&*]/.test(pwd)) score += 35;

      bar.style.width = score + '%';
      bar.style.backgroundColor = score < 40 ? '#ff453a' : score < 70 ? '#ff9f0a' : '#30d158';
    }

    function showMsg(msg, isSuccess) {
      const box = document.getElementById('js-alert');
      box.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
      box.textContent = msg;
      box.style.display = 'block';
    }

    async function requestOTP() {
      const val = document.getElementById('identifier').value.trim();
      const btn = document.getElementById('sendOtpBtn');
      if (!val) return showMsg("Enter Email or Phone first.", false);

      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const res = await fetch('/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: val })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(data.message, true);
          let timeLeft = 60;
          const timer = setInterval(() => {
            btn.textContent = `${timeLeft}s`;
            timeLeft--;
            if (timeLeft < 0) {
              clearInterval(timer);
              btn.disabled = false;
              btn.textContent = "Resend OTP";
            }
          }, 1000);
        } else {
          showMsg(data.error || "Failed to send OTP", false);
          btn.disabled = false;
          btn.textContent = "Send OTP";
        }
      } catch (err) {
        showMsg("Network error. Try again.", false);
        btn.disabled = false;
        btn.textContent = "Send OTP";
      }
    }
  </script>
</body>
</html>
