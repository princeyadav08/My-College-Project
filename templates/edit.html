<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Record</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .box { width: 100%; max-width: 520px; }
    h2 { color: #38bdf8; margin-bottom: 20px; }

    form {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus { outline: none; border-color: #38bdf8; }

    .btn-group { display: flex; gap: 12px; margin-top: 8px; }

    .btn-save {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.85), rgba(0, 199, 255, 0.7));
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 980px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 980px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Edit Record #{{ record[0] }}</h2>

    <form action="/edit/{{ record[0] }}" method="POST">
      <label>Name</label>
      <input type="text" name="name" value="{{ record[1] }}" required>

      <label>Email Address</label>
      <input type="email" name="email" value="{{ record[2] }}" required>

      <label>Message</label>
      <textarea name="message" rows="4" required>{{ record[3] }}</textarea>

      <div class="btn-group">
        <button class="btn-save" type="submit">Update Record</button>
        <a href="/" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>

</body>
</html>
