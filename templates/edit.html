<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Record #{{ record[0] }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      padding: 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; font-size: 1.3rem; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #38bdf8; }
    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 980px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0a84ff);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .links { text-align: center; margin-top: 18px; }
    .links a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .links a:hover { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Edit Record #{{ record[0] }}</h2>
    <form action="/edit/{{ record[0] }}" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ record[1] or '' }}" required>

      <label>Email Address</label>
      <input type="email" name="email" value="{{ record[2] or '' }}" required>

      <label>Phone Number</label>
      <input 
        type="tel" 
        name="phone" 
        value="{{ record[3] or '' }}" 
        placeholder="10-digit mobile number" 
        pattern="[6-9][0-9]{9}" 
        maxlength="10" 
        minlength="10"
        title="Please enter a valid 10-digit mobile number starting with 6, 7, 8, or 9"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
        required>

      <label>Message</label>
      <textarea name="message" rows="3">{{ record[4] or '' }}</textarea>

      <button type="submit" class="btn-save">Update Record</button>
      <div class="links">
        <a href="/">&larr; Back to Dashboard</a>
      </div>
    </form>
  </div>
</body>
</html>
